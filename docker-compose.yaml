x-airflow-common:
  &airflow-common

  image: apache/airflow:3.3.1

  environment:
    &airflow-common-env

    # =====================================================
    # EXECUTOR
    # =====================================================
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    # =====================================================
    # DATABASE
    # =====================================================
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    # =====================================================
    # CELERY
    # =====================================================
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    # =====================================================
    # AIRFLOW CORE
    # =====================================================
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    # =====================================================
    # AUTHENTICATION
    # =====================================================
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__API_AUTH__JWT_SECRET: 'change-this-to-a-long-random-secret'

    # =====================================================
    # API
    # =====================================================
    AIRFLOW__API__BASE_URL: http://localhost:8080
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

    # =====================================================
    # SCHEDULER
    # =====================================================
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

    # =====================================================
    # EMAIL / GMAIL SMTP
    # =====================================================
    AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
    AIRFLOW__SMTP__SMTP_PORT: '587'
    AIRFLOW__SMTP__SMTP_STARTTLS: 'true'
    AIRFLOW__SMTP__SMTP_SSL: 'false'

    AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW_EMAIL}
    AIRFLOW__SMTP__SMTP_PASSWORD: ${GMAIL_APP_PASSWORD}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW_EMAIL}

    # =====================================================
    # SMTP CONNECTION
    # =====================================================
    AIRFLOW_CONN_SMTP_DEFAULT: "smtp://${AIRFLOW_EMAIL}:${GMAIL_APP_PASSWORD}@smtp.gmail.com:587/?__extra__=%7B%22disable_ssl%22%3A%20true%7D"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config

  depends_on:
    postgres:
      condition: service_healthy

    redis:
      condition: service_healthy


services:

  # =====================================================
  # POSTGRES
  # =====================================================

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data


  # =====================================================
  # REDIS
  # =====================================================

  redis:
    image: redis:7.2-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  # =====================================================
  # AIRFLOW INIT
  # =====================================================

  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate


  # =====================================================
  # AIRFLOW API SERVER
  # =====================================================

  airflow-api-server:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  # =====================================================
  # AIRFLOW DAG PROCESSOR
  # =====================================================

  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  # =====================================================
  # AIRFLOW SCHEDULER
  # =====================================================

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  # =====================================================
  # AIRFLOW WORKER
  # =====================================================

  airflow-worker:
    <<: *airflow-common

    command: celery worker

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  # =====================================================
  # AIRFLOW TRIGGERER
  # =====================================================

  airflow-triggerer:
    <<: *airflow-common

    command: triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully


# =====================================================
# VOLUME
# =====================================================

volumes:
  postgres-db-volume: